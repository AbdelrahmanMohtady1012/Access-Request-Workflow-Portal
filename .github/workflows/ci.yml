name: Verify portal
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: access_test
          POSTGRES_USER: access_test
          POSTGRES_PASSWORD: access_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U access_test -d access_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/access_test
          TEST_DB_USERNAME: access_test
          TEST_DB_PASSWORD: access_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
