services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: access_portal
      POSTGRES_USER: access_portal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access_portal -d access_portal"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/access_portal
      DB_USERNAME: access_portal
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      SPRING_PROFILES_ACTIVE: dev
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AccessDemo123!}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
